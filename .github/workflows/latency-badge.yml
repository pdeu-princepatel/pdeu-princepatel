name: update latency badge

on:
  schedule:
    - cron: "0 * * * *"   # runs every hour
  workflow_dispatch:       # adds a manual "Run workflow" button

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4   # pulls your repo's files so the job can commit to it

      - name: Measure latency
        id: measure
        run: |
          START=$(date +%s%N)
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 10 https://disee.xyz)
          END=$(date +%s%N)
          MS=$(( (END - START) / 1000000 ))
          echo "ms=$MS" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Build badge JSON
        run: |
          MS="${{ steps.measure.outputs.ms }}"
          STATUS="${{ steps.measure.outputs.status }}"
          if [ "$STATUS" = "200" ]; then
            COLOR="brightgreen"; MSG="${MS}ms"
          else
            COLOR="red"; MSG="down"
          fi
          mkdir -p badges
          cat > badges/disee-latency.json <<EOF
          {"schemaVersion":1,"label":"disee.xyz","message":"$MSG","color":"$COLOR"}
          EOF

      - name: Commit badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/disee-latency.json
          git diff --staged --quiet || git commit -m "chore: update latency badge"
          git push